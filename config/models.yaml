# Backend configuration
# Models without explicit overrides use these defaults
defaults:
  # Storage paths by model format
  storage:
    primary: ~/models              # Default for safetensors/EXL3/MLX
    gguf: /data/storage2/models    # GGUF models (slower NVMe, more space)

  # Backend defaults: version, extra_args, model_patterns, env_vars
  # Resolution priority (highest to lowest):
  #   1. CLI override (--backend-version, --gpu-memory-utilization, etc.)
  #   2. Model-specific config (models[].backends.{engine}.*)
  #   3. Global defaults below (defaults.backends.{engine}.*)
  # Model-specific extra_args fully replaces global (no merge)
  backends:
    # https://github.com/vllm-project/vllm/releases
    vllm:
      # Commit SHA from wheels.vllm.ai nightly builds (cu130 wheels for Blackwell GPUs)
      # Use /update-vllm-nightly skill to list available builds and update this
      # For stable Docker Hub image instead: --image-type prebuilt --backend-version v0.13.0
      backend_version: da6709c9fe6965b7348692576ffadeee8439388e
      env_vars:
        # Prevent vLLM from spinning at 100% CPU when idle (blocks scheduling)
        VLLM_SLEEP_WHEN_IDLE: "1"
      extra_args:
        # 0.98 causes OOM during vLLM sampler warmup
        - "--gpu-memory-utilization"
        - "0.95"
        # GPU Direct Storage for faster model loading (requires NVMe + GDS support)
        # See: https://docs.vllm.ai/en/latest/models/extensions/fastsafetensor.html
        - "--load-format"
        - "fastsafetensors"
      # Model-specific CLI args (pattern is regex matched against model path)
      model_patterns:
        - pattern: "glm.*v"  # GLM vision models
          args:
            - "--enable-expert-parallel"
            - "--allowed-local-media-path"
            - "/"
            - "--mm-encoder-tp-mode"
            - "data"
            - "--mm_processor_cache_type"
            - "shm"
        - pattern: "mistral|devstral|ministral"
          args:
            - "--tokenizer_mode"
            - "mistral"
            - "--config_format"
            - "mistral"
            - "--load_format"
            - "mistral"
        - pattern: "minimax.*m2\\.1"  # MiniMax M2.1 models (FP8, AWQ, etc.)
          args:
            # FlashInfer is better optimized for MoE and mixed-precision models
            - "--attention-backend"
            - "flashinfer"
            # Cudagraph tuning: vLLM default compiles cudagraphs for batch sizes 1-512,
            # consuming GPU memory for sizes you'll likely never use. Setting both to 64:
            # - Benefit: Saves GPU memory, faster startup (less cudagraph compilation)
            # - Benefit: All scheduled requests get cudagraph acceleration (no CUDA kernel overhead)
            # - Tradeoff: Limits max concurrent requests to 64 (excess requests queue)
            # Both values MUST match: if max-num-seqs > max-cudagraph-capture-size, requests
            # beyond the cudagraph limit fall back to slower CUDA kernel calls.
            # Lower values (e.g., 16) save more memory; 64 is a reasonable default for mixed workloads
            - "--max-num-seqs"
            - "64"
            - "--max-cudagraph-capture-size"
            - "64"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "minimax_m2"
            # Reasoning parser options:
            #   minimax_m2: Puts reasoning in a special field (like DeepSeek) for
            #               frontends that render it separately
            #   minimax_m2_append_think: Wraps reasoning in <think>...</think> tags
            #               as normal text. Enables interleaved thinking where the
            #               model builds on previous reasoning (most frontends discard
            #               the thinking trace, few properly render this format).
            - "--reasoning-parser"
            - "minimax_m2"
            # Sampler overrides to prevent repetition loops (per model card)
            - "--override-generation-config"
            - '{"temperature": 1, "top_p": 0.95, "top_k": 40, "repetition_penalty": 1.1, "frequency_penalty": 0.40}'
          env_vars:
            # Prevent PyTorch memory fragmentation with mixed-precision quantization
            PYTORCH_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:512"
    # https://github.com/ggerganov/llama.cpp/releases
    # Note: b7538 introduced Blackwell changes that break CUDA graphs on SM120
    # Staying on b7531 (last version before that change) for stable performance
    llama:
      backend_version: b7531
      image_type: build
      extra_args:
        - "-ngl"
        - "999"
        - "--jinja"           # Enable Jinja template engine (required for most models)
        - "--flash-attn"
        - "on"                # Enable flash attention for Blackwell GPUs
    # https://catalog.ngc.nvidia.com/orgs/nvidia/teams/tensorrt-llm/containers/release
    trtllm:
      backend_version: 1.2.0rc7
      image_type: prebuilt    # Uses NGC images
    # https://hub.docker.com/r/lmsysorg/sglang/tags
    # NOTE: cu13 nightlies have all-reduce bug on Blackwell TP>1, use stable release
    sglang:
      # Use /update-sglang-nightly skill to list available builds and update this
      backend_version: v0.5.7-cu130-runtime   # Stable cu13 (Jan 2026)
      extra_args:
        - "--mem-fraction-static"
        - "0.98"                # Dedicated inference GPUs, no display
        - "--max-model-len"
        - "65536"
      model_patterns:
        - pattern: "mimo"
          args:
            - "--attention-backend"
            - "triton"
            - "--reasoning-parser"
            - "qwen3"
            - "--tool-call-parser"
            - "mimo"
        - pattern: "minimax.*m2\\.1"
          args:
            - "--attention-backend"
            - "flashinfer"
            - "--max-running-requests"
            - "64"
            - "--cuda-graph-max-bs"
            - "64"
          env_vars:
            PYTORCH_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:512"
    # https://github.com/turboderp-org/exllamav3/releases
    # https://github.com/theroyallab/tabbyAPI (commit SHA, no releases)
    exl:
      backend_version: v0.0.18
      tabby_version: 84bb1ce   # TabbyAPI commit (pinned in Dockerfile default)
      image_type: build
      extra_args:
        - "--cache-size"
        - "32768"
        - "--gpu-split-auto"     # Automatically split model across GPUs
        # --gpu-split 24,24      # Explicit split in GB per GPU (overrides gpu_split_auto)
models:
  - repo_id: MiniMaxAI/MiniMax-M2.1

  - repo_id: cyankiwi/MiniMax-M2.1-AWQ-4bit
    profiles:
      default:
        backend: vllm              # Keep vLLM as default
      sglang:
        backend: sglang
        extra_args:
          - "--frequency-penalty"
          - "0.2"                  # Prevent repetition (flashinfer etc from global pattern)

  - repo_id: mratsim/MiniMax-M2.1-FP8-INT4-AWQ
    profiles:
      default:
        backend: vllm
        extra_args:
          # cu130 devel image has slightly higher memory overhead than cu129
          # 0.91 fits full 196k context (~7GB free per GPU, ~14GB total); 0.90 falls 0.12 GiB short for full context
          - "--gpu-memory-utilization"
          - "0.91"

  - repo_id: unsloth/MiniMax-M2.1-GGUF
    include:
      - "UD-Q4_K_XL/*.gguf"
      - "UD-Q5_K_XL/*.gguf"
      - "Q6_K/*.gguf"
    profiles:
      default:
        backend: llama
        extra_args:
          - "--repeat-penalty"
          - "1.15"                  # Prevent repetition loops in thinking
          - "--repeat-last-n"
          - "128"                   # Consider last 128 tokens for penalty

  - repo_id: QuantTrio/GLM-4.7-AWQ
    profiles:
      default:
        backend: vllm
        extra_args:
          - "--cpu-offload-gb"
          - "15"
          - "--max-model-len"
          - "8192"

  - repo_id: mratsim/GLM-4.7-EXL3
    revisions:
      - 3.84bpw-tuned
      - 4bpw_H6
    profiles:
      default:
        backend: exl

  - repo_id: AesSedai/GLM-4.7-GGUF
    include:
      - "GLM-4.7-IQ4_XS/*.gguf"

  # All tested quants fit in 192GB VRAM with global defaults (jinja + flash_attn)
  - repo_id: unsloth/GLM-4.7-GGUF
    include:
      - "UD-Q3_K_XL/*.gguf"
      - "UD-Q4_K_XL/*.gguf"
      - "UD-Q5_K_XL/*.gguf"
      - "UD-Q6_K_XL/*.gguf"

  - repo_id: ubergarm/GLM-4.7-GGUF
    include:
      - "IQ3_KS/*.gguf"
      - "big-IQ3_KS/*.gguf"

  - repo_id: cyankiwi/MiMo-V2-Flash-AWQ-4bit
    profiles:
      default:
        backend: sglang           # Only SGLang supports this model
        extra_args:
          - "--frequency-penalty"
          - "0.2"               # Prevent repetition loops with AWQ quant

  - repo_id: cyankiwi/Devstral-2-123B-Instruct-2512-AWQ-4bit

  - repo_id: unsloth/Devstral-2-123B-Instruct-2512-GGUF
    include:
      #- "UD-Q3_K_XL/*.gguf"
      - "UD-Q4_K_XL/*.gguf"
      #- "UD-Q5_K_XL/*.gguf"
      #- "UD-Q6_K_XL/*.gguf"

  - repo_id: unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF
    include:
      #- "Devstral-Small-2-24B-Instruct-2512-UD-Q4_K_XL.gguf"
      - "Devstral-Small-2-24B-Instruct-2512-UD-Q6_K_XL.gguf"

  - repo_id: mistralai/Devstral-Small-2-24B-Instruct-2512
    exclude:
      - "model-*.safetensors" # use consolidated

  - repo_id: mistralai/Devstral-2-123B-Instruct-2512
    exclude:
      - "model-*.safetensors" # use consolidated

  - repo_id: google/gemma-3-1b-it

  - repo_id: Qwen/Qwen3-0.6B

  - repo_id: unsloth/Qwen3-VL-235B-A22B-Instruct-GGUF
    include:
      - "UD-Q4_K_XL/*.gguf"
      - "mmproj-F16.gguf"

  - repo_id: unsloth/gpt-oss-20b-GGUF
    include:
      - "gpt-oss-20b-F16.gguf"

  - repo_id: unsloth/gpt-oss-120b-GGUF
    include:
      - "gpt-oss-120b-F16.gguf"

  - repo_id: Qwen/Qwen3-Omni-30B-A3B-Instruct

  - repo_id: Qwen/Qwen-Image-Edit-2509

  - repo_id: openai/gpt-oss-20b

  - repo_id: openai/gpt-oss-safeguard-20b

  - repo_id: openai/gpt-oss-120b

  - repo_id: Qwen/Qwen3-Next-80B-A3B-Thinking-FP8

  - repo_id: unsloth/Qwen3-Next-80B-A3B-Thinking-GGUF
    include:
      - "Qwen3-Next-80B-A3B-Thinking-UD-Q4_K_XL.gguf"

  - repo_id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    profiles:
      default:
        # Nightly has relu2_no_mul bug (#31957), use prebuilt v0.13.0
        backend: vllm
        backend_version: v0.13.0
        image_type: prebuilt      # Docker Hub image (CUDA 12.9)
        extra_args:
          - "--max-num-seqs"
          - "8"                     # Model card recommendation for stability
          - "--max-model-len"
          - "262144"                # 256K context window
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "qwen3_coder"
          - "--reasoning-parser-plugin"
          - "/config/nano_v3_reasoning_parser.py"
          - "--reasoning-parser"
          - "nano_v3"
          - "--kv-cache-dtype"
          - "fp8"
      trtllm:
        backend: trtllm
        extra_args:
          - "--backend"
          - "_autodeploy"
          - "--trust_remote_code"
          - "--reasoning_parser"
          - "nano-v3"
          - "--tool_parser"
          - "qwen3_coder"
          - "--extra_llm_api_options"
          - "/config/nano_v3.yaml"

  # Small model to trial evals
  - repo_id: Qwen/Qwen3-VL-2B-Instruct
  - repo_id: Qwen/Qwen3-VL-2B-Instruct-FP8
  - repo_id: Qwen/Qwen3-VL-4B-Instruct-FP8

  # Small ExLlamaV3 test model (EXL3 4.0bpw quant from non-main branch)
  - repo_id: turboderp/Qwen3-0.6B-exl3
    revisions:
      - 4.0bpw
    backend: exl

  # Small MLX test model:
  - repo_id: mlx-community/gemma-3-1b-it-bf16

  # Small GGUF to try llama.cpp
  - repo_id: unsloth/Qwen3-0.6B-GGUF
    include:
      - "Qwen3-0.6B-UD-Q4_K_XL.gguf"
